name: Unpack dashboard beta
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package
        id: check
        run: |
          if [ -f dashboard-beta-rc1.zip ]; then echo "present=yes" >> "$GITHUB_OUTPUT"; else echo "present=no" >> "$GITHUB_OUTPUT"; fi
      - name: Unpack dashboard
        if: steps.check.outputs.present == 'yes'
        run: |
          rm -rf /tmp/meditaly-dashboard
          mkdir -p /tmp/meditaly-dashboard
          unzip -q dashboard-beta-rc1.zip -d /tmp/meditaly-dashboard
          cp -a /tmp/meditaly-dashboard/meditaly_dashboard_beta_rc1/. .
          rm -f dashboard-beta-rc1.zip
      - name: Commit unpacked dashboard
        if: steps.check.outputs.present == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unpack Meditaly dashboard beta RC1"
          git push
