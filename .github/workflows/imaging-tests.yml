name: Imaging intake and viewer checks
on:
  pull_request:
    paths: ['imaging-*/**', 'services/imaging-worker/**', 'tests/imaging/**', 'supabase/functions/imaging-*/**', 'supabase/migrations/*imaging*.sql']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/imaging-worker/requirements.txt
      - run: python -m unittest discover -s tests/imaging -v
      - run: node --experimental-strip-types --test tests/imaging/manifest.test.mjs
      - run: npm ci --prefix imaging-viewer
      - run: npm audit --prefix imaging-viewer --omit=dev --audit-level=moderate
      - run: npm run build --prefix imaging-viewer
