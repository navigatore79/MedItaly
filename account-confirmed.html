<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Conferma email · Meditaly</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102b4a;background:#f4f8ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,#e4f2ff 0,transparent 45%),#f4f8ff}
    main{width:min(100%,520px);background:#fff;border:1px solid #dbe6f5;border-radius:24px;padding:clamp(28px,5vw,42px);box-shadow:0 22px 65px #103f8014}
    .brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800;letter-spacing:-.02em}.mark{display:grid;place-items:center;width:38px;height:38px;color:#fff;background:#1462c8;border-radius:12px;font-size:22px;font-weight:700}
    .badge{display:inline-flex;align-items:center;gap:8px;margin-top:42px;padding:7px 12px;border-radius:99px;color:#075a43;background:#e6f6ef;font-size:13px;font-weight:700}.badge.error{color:#9b3327;background:#fff0ed}.badge.neutral{color:#33577e;background:#edf4ff}
    h1{font-size:clamp(28px,5vw,36px);line-height:1.15;margin:20px 0 14px;letter-spacing:-.035em}p{color:#53677d;line-height:1.65;margin:0 0 24px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
    a.button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#1462c8;color:#fff;padding:14px 18px;border-radius:12px;font-weight:700}
    a.button.secondary{background:#edf4ff;color:#164777}.small{font-size:13px;margin-top:30px;color:#718198}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">M</span> Meditaly</div>
    <div class="badge neutral" id="badge">Verifica email</div>
    <h1 id="title">Controlla l'esito della conferma</h1>
    <p id="description">Se hai aperto il link di conferma ricevuto per email, puoi tornare a Meditaly e accedere con le tue credenziali.</p>
    <div class="actions">
      <a class="button" href="https://med-italy.vercel.app/">Vai alla dashboard clinica</a>
    </div>
    <p class="small">Per l'account paziente, riapri l'app Meditaly sul telefono.</p>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    const fragment = new URLSearchParams(location.hash.replace(/^#/, ''));
    const error = query.get('error') || fragment.get('error');
    const errorCode = query.get('error_code') || fragment.get('error_code') || '';
    const verified = Boolean(fragment.get('access_token') || query.get('code'));
    history.replaceState(null, '', location.pathname);
    const badge = document.getElementById('badge');
    const title = document.getElementById('title');
    const description = document.getElementById('description');
    if (error) {
      badge.textContent = 'Conferma non riuscita'; badge.className = 'badge error';
      title.textContent = 'Il link non è più valido';
      description.textContent = errorCode === 'otp_expired'
        ? 'Il link di conferma è scaduto o è già stato usato. Prova ad accedere: se l’email risulta già verificata, non serve confermarla di nuovo. Altrimenti richiedi un nuovo link dalla registrazione.'
        : 'Non è stato possibile confermare l’email. Prova ad accedere oppure richiedi un nuovo link dalla registrazione.';
    } else if (verified) {
      badge.textContent = 'Email verificata'; badge.className = 'badge';
      title.textContent = 'Email confermata';
      description.textContent = 'La verifica è riuscita. Torna all’app Meditaly per accedere come paziente, oppure apri la dashboard se hai richiesto un account medico. L’accesso medico richiede l’approvazione dell’amministratore.';
    }
  </script>
</body>
</html>
