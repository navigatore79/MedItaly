<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nuova password · Meditaly</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102b4a;background:#f4f8ff}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,#e4f2ff 0,transparent 45%),#f4f8ff}
    main{width:min(100%,500px);background:#fff;border:1px solid #dbe6f5;border-radius:24px;padding:clamp(28px,5vw,42px);box-shadow:0 22px 65px #103f8014}
    .brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800}.mark{display:grid;place-items:center;width:38px;height:38px;color:#fff;background:#1462c8;border-radius:12px;font-size:22px}
    h1{font-size:clamp(27px,5vw,34px);line-height:1.2;letter-spacing:-.035em;margin:36px 0 12px}p{color:#53677d;line-height:1.6}
    label{display:block;font-size:14px;font-weight:700;margin:20px 0 8px}input{display:block;width:100%;border:1px solid #c9d9ea;border-radius:12px;padding:14px;font-size:16px}
    input:focus-visible,button:focus-visible{outline:3px solid #91b9ee;outline-offset:2px}
    button{width:100%;border:0;border-radius:12px;background:#1462c8;color:#fff;padding:14px 18px;font:700 16px inherit;cursor:pointer;margin-top:24px}button:disabled{opacity:.6;cursor:wait}
    .notice{margin-top:20px;padding:14px 16px;border-radius:12px;background:#edf4ff;color:#244d78;line-height:1.5}.notice.error{background:#fff0ed;color:#933325}.notice.success{background:#e6f6ef;color:#075a43}
    a{color:#145ab1;font-weight:700}.small{font-size:13px;margin-top:30px}.hidden{display:none}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">M</span> Meditaly</div>
    <h1>Imposta una nuova password</h1>
    <p>Scegli una password di almeno 8 caratteri, diversa da quella precedente.</p>
    <div id="status" role="status" aria-live="polite" class="notice">Verifico il link di recupero…</div>
    <form id="form" class="hidden" autocomplete="off">
      <label for="password">Nuova password</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirm">Ripeti la password</label>
      <input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
      <button id="save" type="submit">Salva nuova password</button>
    </form>
    <p class="small">Dopo il salvataggio, torna all’app Meditaly o alla <a href="/">dashboard clinica</a> per accedere.</p>
  </main>
  <script type="module" src="/password-reset.js"></script>
</body>
</html>
